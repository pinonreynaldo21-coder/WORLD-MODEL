<title>World Model Entry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-height column. Country cards carousel on top, summary panel, primary action,
   detail area, fixed tab bar. Sheets slide up from the bottom over a dimmed page (the Amex "entry" feel). */
:root{
  color-scheme:dark;
  --ground:#000;--panel:#15171b;--panel-2:#1c1f24;--line:#2a2e35;
  --ink:#f3f5f8;--ink-2:#9aa1ad;--ink-3:#5d6470;
  --blue:#4a9dff;--blue-deep:#03182b;--good:#4cc38a;--bad:#ff6b6b;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 40% at 50% 12%,#23262d 0,#0a0b0d 55%,#000 100%)}

/* header */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 16px 0;flex:none}
.top h1{margin:0;font-size:19px;font-weight:600;text-align:center;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.14em;margin-top:2px}
.ico{width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
.ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* carousel */
.rail{flex:none;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px calc(50% - 130px) 22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:260px;height:164px;border-radius:12px;scroll-snap-align:center;position:relative;overflow:hidden;padding:14px 16px;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .35s;transform:scale(.86);opacity:.55;filter:saturate(.8);text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.card.on{transform:scale(1);opacity:1;filter:none;box-shadow:0 0 60px rgba(210,220,235,.22),0 14px 34px rgba(0,0,0,.7)}
.card::before{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid var(--edge);pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 6px);mix-blend-mode:overlay;pointer-events:none}
.t-plat{--edge:rgba(60,64,72,.55);--fg:#1d2026;background:linear-gradient(135deg,#f4f6f8,#c5cad1 45%,#e9ecef 60%,#aeb4bc)}
.t-gold{--edge:rgba(120,90,30,.5);--fg:#3a2c0d;background:linear-gradient(135deg,#f6ecc9,#d9bf7a 50%,#efe0ac 65%,#c4a457)}
.t-blue{--edge:rgba(255,255,255,.28);--fg:#eaf4ff;background:linear-gradient(135deg,#59b3ee,#2f86d4 50%,#5aa8e6 70%,#2a76bd)}
.card *{color:var(--fg)}
.card .brand{position:absolute;left:0;right:0;top:15px;text-align:center;font-weight:700;letter-spacing:.14em;font-size:13px}
.card .chip{position:absolute;left:18px;top:52px;width:44px;height:34px;border-radius:6px;border:1.5px solid var(--fg);opacity:.75;background:
 linear-gradient(var(--fg),var(--fg)) 50% 0/1.5px 100% no-repeat,linear-gradient(var(--fg),var(--fg)) 0 50%/100% 1.5px no-repeat}
.card .globe{position:absolute;left:50%;top:38px;width:68px;height:68px;transform:translateX(-50%);opacity:.8}
.card .globe *{fill:none;stroke:var(--fg);stroke-width:1.2}
.card .iso{position:absolute;right:18px;top:64px;font-family:var(--f-mono);font-size:15px;letter-spacing:.06em}
.card .since{position:absolute;right:18px;top:88px;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;opacity:.8}
.card .name{position:absolute;left:18px;right:18px;bottom:14px;font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .frozen{position:absolute;inset:0;background:rgba(160,205,255,.5);backdrop-filter:blur(2px);display:none;place-items:center;font-weight:700;letter-spacing:.2em;font-size:13px}
.card.freeze .frozen{display:grid}

/* summary */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 96px}
.panel{background:var(--panel);border-radius:14px;padding:18px 18px 0;position:relative}
.panel.swap{animation:swap .3s ease}
@keyframes swap{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.lbl{color:var(--ink-2);font-size:17px}
.big{font-size:44px;font-weight:700;letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.big.pos{color:var(--ink)}.big small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:8px}
.dots{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center}
.dots svg{width:24px;height:24px;fill:currentColor}
.meta{margin-top:14px;color:var(--ink-2);font-size:17px;line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink-2);font-size:17px;margin-top:6px}
.row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.row .i{display:inline-grid;place-items:center;width:22px;height:22px;border:1.6px solid var(--blue);border-radius:50%;color:var(--blue);font-size:13px;font-weight:600;margin-left:8px;vertical-align:1px}
.link{display:block;width:100%;text-align:left;color:var(--blue);font-size:19px;padding:16px 0 18px;margin-top:16px;border-top:1px solid var(--line)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:16px;padding:19px;border-radius:12px;background:var(--blue-deep);color:var(--blue);font-size:21px;font-weight:600}
.cta svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6}
.empty{display:grid;place-items:center;text-align:center;gap:14px;padding:44px 24px 20px}
.empty .g{width:58px;height:58px;border-radius:50%;background:#c9c9cd;color:#111;display:grid;place-items:center;font-size:34px;font-weight:700;font-family:Georgia,serif}
.empty h2{margin:0;font-size:26px;font-weight:700}
.empty p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.5;max-width:32ch}
.thesis{margin:22px 4px 0;color:var(--ink-2);font-size:15px;line-height:1.55}
.thesis h3{margin:0 0 6px;color:var(--ink);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#0b0c0e;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;justify-items:center;gap:4px;color:var(--ink-2);font-size:12.5px;min-height:52px;align-content:center}
.tab svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--blue)}
.tab[aria-selected=true] svg{fill:currentColor;fill-opacity:.9}

/* sheets */
.veil{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .28s;z-index:10}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:88%;display:flex;flex-direction:column}
.sheet.show{transform:none}
.x{align-self:flex-end;width:62px;height:62px;border-radius:50%;background:#2b2d31;display:grid;place-items:center;margin-bottom:14px;flex:none}
.x svg{width:24px;height:24px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.group{background:var(--panel-2);border-radius:14px;padding:0 16px;overflow-y:auto;min-height:0}
.item{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:20px 0;font-size:20px;border-top:1px solid #2e3238}
.item:first-child{border-top:0}
.item .ic{width:34px;height:34px;flex:none;color:var(--blue);display:grid;place-items:center}
.item .ic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.item .tx{flex:1;min-width:0}
.item small{display:block;color:var(--ink-2);font-size:14px;margin-top:3px;line-height:1.4}
.item .chev{width:20px;height:20px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.sheet h2{margin:0 0 4px;font-size:22px}
.pad{padding:18px 0}
.sl{display:grid;gap:6px;padding:12px 0;border-top:1px solid #2e3238}
.sl:first-of-type{border-top:0}
.sl label{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sl label span:last-child{font-family:var(--f-mono);color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue)}
.bar{display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .tr{position:relative;height:8px;background:#2a2e35;border-radius:4px}
.bar .tr::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.bar .f{position:absolute;top:0;bottom:0;border-radius:4px}
.bar .v{font-family:var(--f-mono);text-align:right}
.sc{padding:14px 0;border-top:1px solid #2e3238;display:grid;gap:8px}
.sc:first-of-type{border-top:0}
.sc .h{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sc .h span:last-child{color:var(--ink-2);font-family:var(--f-mono);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:15px;color:var(--ink-2)}
.chip-b[aria-pressed=true]{border-color:var(--blue);color:var(--blue);background:var(--blue-deep)}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#3a3e46;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--good)}.sw[aria-checked=true]::after{transform:translateX(20px)}
.find{width:100%;background:#0d0e10;border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--ink);font:inherit;font-size:17px;margin-bottom:10px}
.toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#e8ebef;color:#111;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.page-other{padding:40px 24px;text-align:center;color:var(--ink-2);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.big{font-size:38px}.lbl,.row,.meta{font-size:15px}}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="ico" id="btnFind" aria-label="Find a country"><svg viewBox="0 0 32 32"><rect x="3" y="7" width="22" height="16" rx="3"/><rect x="7" y="4" width="22" height="16" rx="3" opacity=".0"/><path d="M7 4h19a3 3 0 0 1 3 3v13"/><rect x="7" y="16" width="6" height="4" rx="1.4"/></svg></button>
    <div><h1 id="hName">United States</h1><span class="sub" id="hSub">····USA</span></div>
    <button class="ico" id="btnAsk" aria-label="Notes"><svg viewBox="0 0 32 32"><path d="M9 6h17a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4l-5 5v-5H9a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M4 11v12a2 2 0 0 0 2 2h1"/></svg></button>
  </header>

  <div class="rail" id="rail" role="listbox" aria-label="Countries"></div>

  <main class="scroll" id="scroll">
    <section class="panel" id="panel">
      <button class="dots" id="btnMore" aria-label="More actions"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      <div class="lbl" id="pLbl">Previous Activity</div>
      <div class="big" id="pBig">$0.00</div>
      <div class="meta" id="pMeta"></div>
      <div class="row"><span>Headroom<span class="i" id="tipHead" role="button" tabindex="0" aria-label="What is headroom">i</span></span><b id="pHead"></b></div>
      <button class="link" id="btnStatements">Thesis and Evidence</button>
    </section>
    <button class="cta" id="btnRun"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><path d="M17.5 10.2c-.6-1-1.8-1.6-3.5-1.6-2 0-3.4 1-3.4 2.5 0 3.6 7 1.7 7 5.4 0 1.6-1.5 2.6-3.6 2.6-1.8 0-3.1-.7-3.7-1.8M14 6.5v15"/></svg><span id="ctaTxt">Run Scenario</span></button>
    <div id="below"></div>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="home"><svg viewBox="0 0 34 34"><path d="M5 16.5 17 5l12 11.5V29H21v-8h-8v8H5z"/></svg>Home</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="blocs"><svg viewBox="0 0 34 34"><path d="M17 4 28 9v9c0 6-5 10-11 12C11 28 6 24 6 18V9z"/><path d="m17 11 1.9 4 4.3.5-3.2 3 .9 4.3-3.9-2.2-3.9 2.2.9-4.3-3.2-3 4.3-.5z"/></svg>Blocs</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="scen"><svg viewBox="0 0 34 34"><circle cx="8" cy="17" r="3.5"/><circle cx="26" cy="8" r="3.5"/><circle cx="26" cy="26" r="3.5"/><path d="M11.5 17H16c3 0 3-9 6.500-9M16 17c3 0 3 9 6.500 9"/></svg>Scenarios</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="model"><svg viewBox="0 0 34 34"><circle cx="17" cy="11" r="5.5"/><path d="M6 29c0-6 5-10 11-10s11 4 11 10z"/></svg>Model</button>
  </nav>

  <div class="veil" id="veil"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="x" id="btnX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    <div class="group" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/*DATA*/
(function(){
"use strict";
var S=DATA.scenarios,C=DATA.countries;
var st={i:0,scen:'weighted',w:S.map(function(s){return s.prior}),frozen:{},sync:{sweep:true,alert:true,evidence:false},tab:'home'};
try{var sv=JSON.parse(localStorage.getItem('wm-entry')||'null');if(sv){st.w=sv.w||st.w;st.frozen=sv.frozen||{};st.sync=sv.sync||st.sync}}catch(e){}
function save(){try{localStorage.setItem('wm-entry',JSON.stringify({w:st.w,frozen:st.frozen,sync:st.sync}))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var fmt=function(n){return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* model: weighted outlook = sum(weight_i * impact_i) / sum(weights); impacts run -3..+3 */
function weighted(c){var t=0,s=0;for(var k=0;k<S.length;k++){t+=st.w[k]*c.m[k];s+=st.w[k]}return s?t/s:0}
function value(c){if(!c.m)return null;if(st.scen==='weighted')return weighted(c);return c.m[S.findIndex(function(s){return s.id===st.scen})]}
function tier(c){if(!c.m)return'blue';var w=weighted(c);return w>=1.5?'plat':w>=.5?'gold':'blue'}

var globe='<svg class="globe" viewBox="0 0 68 68"><circle cx="34" cy="34" r="30"/><ellipse cx="34" cy="34" rx="12" ry="30"/><path d="M6 24h56M6 44h56M34 4v60"/></svg>';
var rail=$('rail');
rail.innerHTML=C.map(function(c,k){return '<button class="card t-'+tier(c)+(st.frozen[c.i]?' freeze':'')+'" role="option" data-k="'+k+'" aria-label="'+esc(c.n)+'"><span class="brand">WORLD MODEL</span><span class="chip"></span>'+globe+'<span class="iso">'+c.i+'</span><span class="since">MODEL 2026</span><span class="name">'+esc(c.n)+'</span><span class="frozen">ASSUMPTIONS FROZEN</span></button>'}).join('');
var cards=[].slice.call(rail.children);

function retier(){cards.forEach(function(el,k){el.className='card t-'+tier(C[k])+(k===st.i?' on':'')+(st.frozen[C[k].i]?' freeze':'')})}

function render(anim){
  var c=C[st.i];
  $('hName').textContent=c.n;$('hSub').textContent='····'+c.i;
  var scName=st.scen==='weighted'?'Scenario-weighted outlook':S.find(function(s){return s.id===st.scen}).name;
  var v=value(c);
  $('pLbl').textContent=c.m?scName:'Outlook';
  var big=$('pBig');
  if(c.m){big.innerHTML=fmt(v)+'<small>of ±3</small>';
    var lo=Math.min.apply(null,c.m),hi=Math.max.apply(null,c.m);
    $('pMeta').textContent='Range across scenarios '+fmt(lo)+' to '+fmt(hi)+'. Updated '+DATA.asOf+'.';
    $('pHead').textContent=fmt(3-v);
  }else{big.innerHTML='No score<small>seed row</small>';
    $('pMeta').textContent='Seed row. No country research yet, so nothing is scored. Region: '+c.r+'.';
    $('pHead').textContent='—';}
  $('ctaTxt').textContent=st.frozen[c.i]?'Assumptions frozen':'Run Scenario';
  $('below').innerHTML=c.t?'<div class="thesis"><h3>Base-case thesis</h3>'+esc(c.t)+'</div>':
    '<div class="empty"><div class="g">i</div><h2>No Modeled Activity</h2><p>'+esc(c.n)+' is a seed row in the 197-economy registry. Add sources and priors to start scoring it.</p></div>';
  if(anim){var p=$('panel');p.classList.remove('swap');void p.offsetWidth;p.classList.add('swap')}
  retier();
}

/* carousel: track the card nearest the rail centre */
var raf=0;
function nearest(){var mid=rail.scrollLeft+rail.clientWidth/2,best=0,d=1e9;
  for(var k=0;k<cards.length;k++){var m=Math.abs(cards[k].offsetLeft+cards[k].offsetWidth/2-mid);if(m<d){d=m;best=k}}return best}
rail.addEventListener('scroll',function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(function(){var k=nearest();if(k!==st.i){st.i=k;render(true)}})},{passive:true});
rail.addEventListener('click',function(e){var b=e.target.closest('.card');if(b)goto(+b.dataset.k,true)});
function goto(k,smooth){st.i=k;var el=cards[k];rail.scrollTo({left:el.offsetLeft+el.offsetWidth/2-rail.clientWidth/2,behavior:smooth?'smooth':'auto'});render(true)}
rail.tabIndex=0;
rail.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&st.i<C.length-1){goto(st.i+1,true);e.preventDefault()}if(e.key==='ArrowLeft'&&st.i>0){goto(st.i-1,true);e.preventDefault()}});

/* sheets */
var sheet=$('sheet'),veil=$('veil'),body=$('sheetBody'),lastFocus=null;
function open(html){lastFocus=document.activeElement;body.innerHTML=html;body.scrollTop=0;sheet.classList.add('show');veil.classList.add('show');sheet.setAttribute('aria-hidden','false');$('btnX').focus()}
function close(){sheet.classList.remove('show');veil.classList.remove('show');sheet.setAttribute('aria-hidden','true');if(lastFocus)lastFocus.focus()}
$('btnX').onclick=close;veil.onclick=close;
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
var chev='<svg class="chev" viewBox="0 0 20 20"><path d="m7 3 7 7-7 7"/></svg>';
function item(key,icon,title,sub){return '<button class="item" data-act="'+key+'"><span class="ic">'+icon+'</span><span class="tx">'+title+(sub?'<small>'+sub+'</small>':'')+'</span>'+chev+'</button>'}
var I={
 freeze:'<svg viewBox="0 0 34 34"><path d="M17 3 28 7v9c0 7-5 12-11 15C11 28 6 23 6 16V7z"/><path d="M17 10v14M11 13.5l12 7M23 13.5l-12 7"/></svg>',
 manage:'<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="4.5"/><path d="M17 3v4M17 27v4M3 17h4M27 17h4M7 7l3 3M24 24l3 3M27 7l-3 3M10 24l-3 3"/></svg>',
 power:'<svg viewBox="0 0 34 34"><path d="M3 9h17v14H3z"/><path d="M26 4 18 17h6l-3 11 10-15h-6z"/></svg>',
 auto:'<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="12"/><path d="M21 12c-.8-1.5-2.3-2.2-4.2-2.2-2.400 0-4 1.200-4 3 0 4.400 8.400 2 8.400 6.400 0 1.900-1.800 3.100-4.300 3.100-2 0-3.700-.9-4.400-2.300M17 7v20"/></svg>'};
var acts={
 menu:function(){var c=C[st.i];open(
   item('freeze',I.freeze,st.frozen[c.i]?'Unfreeze Assumptions':'Freeze Assumptions')+
   item('weights',I.manage,'Manage Weights')+
   item('power',I.power,'Check Scenario Power')+
   item('auto',I.auto,'Manage Auto-Updates'))},
 freeze:function(){var c=C[st.i];st.frozen[c.i]=!st.frozen[c.i];save();close();render();toast(c.n+(st.frozen[c.i]?' assumptions frozen':' assumptions unfrozen'))},
 weights:function(){var tot=st.w.reduce(function(a,b){return a+b},0)||1;
   open('<div class="pad"><h2>Scenario weights</h2><small style="color:var(--ink-2)">Subjective priors from the model package. Changes re-score every country.</small></div>'+
   S.map(function(s,k){return '<div class="sl"><label for="w'+k+'"><span>'+esc(s.name)+'</span><span id="wv'+k+'">'+Math.round(st.w[k]/tot*100)+'%</span></label><input type="range" id="w'+k+'" min="0" max="60" value="'+st.w[k]+'" data-k="'+k+'"></div>'}).join('')+
   '<button class="item" data-act="resetw" style="color:var(--blue)">Reset to package priors</button>');
   [].forEach.call(body.querySelectorAll('input[type=range]'),function(r){r.oninput=function(){st.w[+r.dataset.k]=+r.value;var t=st.w.reduce(function(a,b){return a+b},0)||1;S.forEach(function(_,j){$('wv'+j).textContent=Math.round(st.w[j]/t*100)+'%'});save();render()}})},
 resetw:function(){st.w=S.map(function(s){return s.prior});save();render();acts.weights()},
 power:function(){var c=C[st.i];
   if(!c.m){open('<div class="pad"><h2>'+esc(c.n)+'</h2><p style="color:var(--ink-2);line-height:1.5">No scenario impacts yet. Add research for this country to see which futures help or hurt it.</p></div>');return}
   open('<div class="pad"><h2>Scenario power</h2><small style="color:var(--ink-2)">How '+esc(c.n)+' fares in each future, scored −3 to +3.</small></div>'+
   S.map(function(s,k){var v=c.m[k],p=Math.abs(v)/3*50;return '<div class="sc"><div class="h"><span>'+esc(s.name)+'</span><span>'+s.prior+'% prior</span></div><div class="bar"><div class="tr"><div class="f" style="'+(v>=0?'left:50%':'right:50%')+';width:'+p+'%;background:'+(v>=0?'var(--good)':'var(--bad)')+'"></div></div><span class="v">'+fmt(v)+'</span></div></div>'}).join(''))},
 auto:function(){var rows=[['sweep','Weekly source sweep','Re-check the source ledger for new evidence'],['alert','Alert on large shifts','Notify when an outlook moves by 0.5 or more'],['evidence','Require two sources','Hold score changes until a second source agrees']];
   open('<div class="pad"><h2>Auto-updates</h2></div>'+rows.map(function(r){return '<div class="item" style="cursor:default"><span class="tx">'+r[1]+'<small>'+r[2]+'</small></span><button class="sw" role="switch" aria-checked="'+st.sync[r[0]]+'" aria-label="'+r[1]+'" data-sw="'+r[0]+'"></button></div>'}).join(''))},
 run:function(){open('<div class="pad"><h2>Run Scenario</h2><small style="color:var(--ink-2)">Choose a future to score every country against.</small></div><div class="pad" style="padding-top:0"><div class="chips">'+
   '<button class="chip-b" data-pick="weighted" aria-pressed="'+(st.scen==='weighted')+'">Weighted</button>'+
   S.map(function(s){return '<button class="chip-b" data-pick="'+s.id+'" aria-pressed="'+(st.scen===s.id)+'">'+esc(s.name)+'</button>'}).join('')+'</div>'+
   '<p id="pickDesc" style="color:var(--ink-2);font-size:14px;line-height:1.5;margin:14px 0 0"></p></div>');pickDesc()},
 evidence:function(){var c=C[st.i];
   open('<div class="pad"><h2>'+esc(c.n)+'</h2><small style="color:var(--ink-2)">'+esc(c.r)+' · registry '+c.i+'</small><p style="line-height:1.55;margin:14px 0 0">'+(c.t?esc(c.t):'Seed row. Priors are placeholders until country research is added.')+'</p><p style="color:var(--ink-2);font-size:13px;line-height:1.5">Scores are analyst models, not facts. Weights are editable under Manage Weights.</p></div>')}
};
function pickDesc(){var s=S.find(function(x){return x.id===st.scen}),d=$('pickDesc');if(d)d.textContent=s?s.desc+' Winners: '+s.win+'.':'Blends all five scenarios using your weights.'}
sheet.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(a&&acts[a.dataset.act]){acts[a.dataset.act]();return}
  var p=e.target.closest('[data-pick]');if(p){st.scen=p.dataset.pick;[].forEach.call(body.querySelectorAll('[data-pick]'),function(b){b.setAttribute('aria-pressed',b===p)});pickDesc();render(true);return}
  var w=e.target.closest('[data-sw]');if(w){var k=w.dataset.sw;st.sync[k]=!st.sync[k];w.setAttribute('aria-checked',st.sync[k]);save()}
});
$('btnMore').onclick=acts.menu;$('btnRun').onclick=acts.run;$('btnStatements').onclick=acts.evidence;
$('btnAsk').onclick=function(){toast('Notes are coming to this section')};
function tip(){open('<div class="pad"><h2>Headroom</h2><p style="color:var(--ink-2);line-height:1.5">Distance from the current score to the maximum of +3. A larger number means more room for this country to improve under the selected scenario.</p></div>')}
$('tipHead').onclick=tip;$('tipHead').onkeydown=function(e){if(e.key==='Enter'||e.key===' ')tip()};

/* search-first: find any of the 197 countries */
$('btnFind').onclick=function(){
  open('<input class="find" id="q" type="search" placeholder="Search 197 countries" autocomplete="off" aria-label="Search countries"><div id="res"></div>');
  var q=$('q'),res=$('res');
  function list(){var t=q.value.trim().toLowerCase();
    var m=C.map(function(c,k){return{c:c,k:k}}).filter(function(o){return!t||o.c.n.toLowerCase().indexOf(t)>-1||o.c.i.toLowerCase()===t||o.c.r.toLowerCase().indexOf(t)>-1}).slice(0,40);
    res.innerHTML=m.length?m.map(function(o){return '<button class="item" data-go="'+o.k+'" style="padding:14px 0;font-size:17px"><span class="tx">'+esc(o.c.n)+'<small>'+esc(o.c.r)+' · '+o.c.i+'</small></span>'+chev+'</button>'}).join(''):'<p style="color:var(--ink-2);padding:16px 0">No country matches.</p>'}
  q.oninput=list;list();
  res.onclick=function(e){var b=e.target.closest('[data-go]');if(b){close();goto(+b.dataset.go,false)}};
};

/* tabs: Home is built; the others say so plainly */
[].forEach.call(document.querySelectorAll('.tab'),function(t){t.onclick=function(){
  [].forEach.call(document.querySelectorAll('.tab'),function(x){x.setAttribute('aria-selected',x===t)});
  st.tab=t.dataset.tab;
  if(st.tab==='home'){$('panel').hidden=$('btnRun').hidden=false;render();return}
  toast({blocs:'Blocs section is next',scen:'Scenario Lab is next',model:'Model settings are next'}[st.tab]);
  setTimeout(function(){var h=document.querySelector('[data-tab=home]');h.click()},1400)}});

var tt=0;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}

render();
requestAnimationFrame(function(){goto(0,false)});
})();
</script>
