<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>World Model Wallet</title>
<style>
/* Layout: an iOS-style wallet app in one phone-width frame. Home tab = header, metal-card carousel,
   summary panel, primary action, activity. Pushed screens slide in from the right; the run flow is a
   page sheet that scales the app back; the card menu is a dimmed bottom sheet. Deliberately dark-only. */
:root{
  color-scheme:dark;
  --bg:#000;--cell:#1c1c1e;--cell2:#2c2c2e;--sep:#38383a;--hl:#3a3a3c;
  --t1:#fff;--t2:#98989f;--t3:#636366;
  --blue:#4c9bf5;--navy:#06172c;--fill:#2f7cf6;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;
  --seg:rgba(118,118,128,.24);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.88,.28,1);
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;letter-spacing:-.01em}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input{font:inherit;color:var(--t1);-webkit-user-select:text;user-select:text}
a{color:var(--blue);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
[hidden]{display:none!important}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000;transform-origin:50% 100%;transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s var(--ease)}
#stage.back{transform:scale(.92) translateY(-6px);border-radius:12px;filter:brightness(.62)}
.layer{position:absolute;inset:0;transition:transform .45s var(--ease),filter .45s var(--ease)}
.layer.under{transform:translateX(-28%);filter:brightness(.55)}

/* ---------- tabs ---------- */
.tab{position:absolute;inset:0 0 58px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;display:none}
.tab.on{display:block}
#tab-home{top:62px;background:radial-gradient(130% 34% at 50% 0%,#222325 0,#0b0b0c 62%,#000 100%) no-repeat,#000}
#tabbar{position:absolute;left:0;right:0;bottom:0;height:58px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,18,20,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid #2a2a2c;z-index:3}
.tb{display:grid;justify-items:center;align-content:center;gap:3px;color:#8e8e93;font-size:10.5px;font-weight:500;letter-spacing:0;position:relative}
.tb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.tb.on{color:var(--blue)}
.tb.on svg .f{fill:currentColor;stroke:currentColor}
.badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}

/* ---------- home header ---------- */
#hhead{position:absolute;top:0;left:0;right:0;height:62px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 6px;background:#1c1d1f;background:linear-gradient(#1f2022,#1a1b1d);z-index:2}
.hbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--blue);justify-self:center;border-radius:10px}
.hbtn:active{opacity:.45}
.hbtn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.ht{text-align:center;min-width:0;transition:opacity .18s}
.ht.fade{opacity:0}
#hTitle{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
#hSub{font-size:12.5px;color:#d8d8dc;letter-spacing:.06em;margin-top:1px}

/* ---------- carousel ---------- */
.railwrap{position:relative;height:188px;margin-top:2px}
#rail{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 calc(50% - 113px);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#rail::-webkit-scrollbar{display:none}
.slot{flex:0 0 226px;height:100%;position:relative;scroll-snap-align:center;scroll-snap-stop:always;--a:1;--d:0}
.slot::before{content:"";position:absolute;left:50%;top:50%;width:330px;height:250px;margin:-125px 0 0 -165px;border-radius:50%;background:radial-gradient(closest-side,rgba(222,226,234,.34),rgba(222,226,234,.13) 55%,rgba(222,226,234,0));opacity:calc(1 - var(--a));pointer-events:none}
.card{position:absolute;left:50%;top:50%;width:236px;height:149px;margin:-74.5px 0 0 -118px;border-radius:9px;background-size:100% 100%;transform:scale(calc(1 - var(--a) * .335));box-shadow:0 0 0 .6px rgba(255,255,255,.28) inset,0 1px 0 rgba(255,255,255,.35) inset,0 10px 22px rgba(0,0,0,.6);--ink:#25282d;--emb:rgba(255,255,255,.55);color:var(--ink);will-change:transform}
.card .med{position:absolute;left:90px;top:37px;width:56px;height:70px}
.card .c-no{position:absolute;left:170px;top:66px;font-size:12px;font-weight:500;letter-spacing:.05em;text-shadow:0 .6px 0 var(--emb)}
.card .c-name{position:absolute;left:23px;right:70px;bottom:10px;font-size:11.5px;font-weight:500;letter-spacing:.075em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip;text-shadow:0 .6px 0 var(--emb)}
.card .c-name.s1{font-size:10.2px;letter-spacing:.06em}.card .c-name.s2{font-size:9px;letter-spacing:.05em}
.card i{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.card .c-gloss{background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.26) 47%,rgba(255,255,255,.06) 53%,rgba(255,255,255,0) 62%) no-repeat;background-size:260% 100%;background-position:calc(50% + var(--d) * 70%) 0;mix-blend-mode:soft-light}
.card .c-dim{background:#000;opacity:calc(var(--a) * .5)}
.card .c-frost{display:none;place-items:center;background:linear-gradient(140deg,rgba(205,232,255,.55),rgba(150,196,240,.32) 55%,rgba(205,232,255,.5));-webkit-backdrop-filter:blur(.7px);backdrop-filter:blur(.7px);box-shadow:0 0 0 1px rgba(255,255,255,.55) inset}
.card .c-frost svg{width:46px;height:46px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;filter:drop-shadow(0 1px 2px rgba(0,40,90,.4))}
.card.frozen .c-frost{display:grid}
.t-plat{--ink:#25282d;--emb:rgba(255,255,255,.6)}
.t-gold{--ink:#3a2a0b;--emb:rgba(255,246,214,.55)}
.t-blue{--ink:#f2f8ff;--emb:rgba(0,30,70,.35)}
.t-graph{--ink:#d4d7dc;--emb:rgba(0,0,0,.6)}
.t-green{--ink:#1f3a2a;--emb:rgba(235,255,240,.5)}

/* ---------- home body ---------- */
.px{padding:0 16px 28px}
.panel{background:var(--cell);border-radius:13px;padding:15px 16px 0;position:relative;transition:opacity .18s}
.fadeable.fade{opacity:.25}
.p-lbl{color:var(--t2);font-size:17px;padding-right:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-big{font-size:31px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.p-dots{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1.6px solid var(--blue);display:grid;place-items:center;color:var(--blue)}
.p-dots:active{opacity:.45}
.p-dots svg{width:18px;height:18px;fill:currentColor}
.p-line{color:var(--t2);font-size:15.5px;margin-top:13px}
.p-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:15.5px;color:var(--t2)}
.p-row b{color:var(--t1);font-weight:400}
.info{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1.4px solid var(--blue);color:var(--blue);font-size:13px;font-weight:600;margin-left:9px;vertical-align:-3px;font-family:Georgia,"Times New Roman",serif;font-style:normal}
.p-sep{height:.5px;background:var(--sep);margin-top:17px}
.p-link{display:block;width:100%;color:var(--blue);font-size:17px;padding:14px 0 15px}
.p-link:active{opacity:.45}
.paybtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;margin-top:15px;border-radius:12px;background:var(--navy);color:var(--blue);font-size:18px;font-weight:600}
.paybtn:active{background:#0b2240}
.paybtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5}
.frozenbar{display:flex;align-items:center;gap:10px;background:#0d2238;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:15px}
.frozenbar svg{width:22px;height:22px;stroke:#9fd0ff;fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.frozenbar span{flex:1}
.frozenbar button{color:var(--blue);font-weight:600}
.empty{display:grid;justify-items:center;gap:14px;padding:44px 20px 12px;text-align:center}
.empty .ig{width:44px;height:44px;border-radius:50%;background:#c7c7cc;color:#000;display:grid;place-items:center;font:700 29px/1 Georgia,"Times New Roman",serif}
.empty h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.empty p{margin:0;color:var(--t2);font-size:15px;max-width:30ch}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 9px}
.sec-h h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec-h button{color:var(--blue);font-size:16px}

/* ---------- grouped lists ---------- */
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:13px;width:100%;min-height:48px;padding:11px 16px;position:relative;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.ic+.cell::before,.group.icons .cell+.cell::before{left:58px}
button.cell:active,.cell.tap:active{background:var(--hl)}
.cell .main{flex:1;min-width:0}
.cell .t{font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .t.wrap{white-space:normal}
.cell .s{font-size:13.5px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s.wrap{white-space:normal;line-height:1.35}
.cell .v{font-size:16.5px;text-align:right;flex:none}
.cell .v small{display:block;font-size:12px;color:var(--t2)}
.cell .v.dim{color:var(--t2)}
.chev{width:9px;height:15px;flex:none;stroke:#5a5a5f;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cell .lic{width:29px;height:29px;flex:none;color:var(--blue);display:grid;place-items:center}
.cell .lic svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gh{font-size:13px;color:#8e8e93;text-transform:uppercase;letter-spacing:.02em;padding:24px 16px 7px}
.gf{font-size:13px;color:#8e8e93;padding:7px 16px 0;line-height:1.4}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--t2)}

/* ---------- pushed screens ---------- */
.scr{position:absolute;inset:0;background:#000;transform:translateX(100%);transition:transform .45s var(--ease),filter .45s var(--ease);z-index:5;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.6)}
.scr.in{transform:none}
.scr.drag{transition:none}
.nav{flex:none;height:52px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;background:rgba(14,14,15,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid #242426}
.nav h2{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-back{height:44px;display:flex;align-items:center;padding-left:10px;color:var(--blue)}
.nav-back svg{width:13px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-back:active,.nav-r button:active{opacity:.45}
.nav-r{justify-self:end;padding-right:14px;color:var(--blue);font-size:17px}
.scr-body{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 16px 40px}
.large{font-size:33px;font-weight:700;letter-spacing:-.02em;margin:10px 4px 2px}
.tabhead{padding:14px 20px 4px;font-size:33px;font-weight:700;letter-spacing:-.02em}
.tabpad{padding:0 16px 30px}

.hero{text-align:center;padding:26px 8px 6px}
.hero .amt{font-size:40px;font-weight:700;letter-spacing:-.02em}
.hero .who{font-size:19px;font-weight:600;margin-top:6px}
.hero .when{font-size:14px;color:var(--t2);margin-top:4px}
.para{background:var(--cell);border-radius:12px;padding:14px 16px;font-size:15.5px;line-height:1.45;color:#e5e5ea;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--cell2);border-radius:8px;padding:6px 10px;font-size:14px;color:#e5e5ea}
.chip.b{color:var(--blue)}

/* segmented control */
.segc{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;background:var(--seg);border-radius:9px;padding:2px;margin:12px 0 4px;position:relative}
.segc button{text-align:center;height:30px;border-radius:7px;font-size:13.5px;font-weight:600;color:#fff;transition:background .2s}
.segc button[aria-pressed=true]{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.25)}

/* switch */
.sw{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw[aria-checked=true]{background:var(--green)}
.sw[aria-checked=true]::after{transform:translateX(20px)}

/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:6px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--blue),var(--blue)) 0/var(--p,50%) 100% no-repeat,#3a3a3c}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3a3a3c}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--blue)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}

/* buttons */
.primary{display:grid;place-items:center;width:100%;height:50px;border-radius:12px;background:var(--fill);color:#fff;font-size:17px;font-weight:600}
.primary:active{background:#2466cf}
.primary[disabled]{background:#2c2c2e;color:#636366}
.plain{display:grid;place-items:center;width:100%;height:48px;color:var(--blue);font-size:17px}
.danger{color:var(--red)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* radio rows */
.radio{width:23px;height:23px;border-radius:50%;border:1.6px solid #545458;flex:none;display:grid;place-items:center}
[aria-checked=true]>.radio{background:var(--fill);border-color:var(--fill)}
[aria-checked=true]>.radio::after{content:"";width:9px;height:5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- card action sheet ---------- */
#veil{position:absolute;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#veil.on{opacity:1;pointer-events:auto}
#asheet{position:absolute;left:0;right:0;bottom:0;z-index:21;padding:0 16px 30px;transform:translateY(110%);transition:transform .42s var(--ease);display:flex;flex-direction:column;max-height:92%}
#asheet.on{transform:none}
#asheet.drag{transition:none}
.xbtn{align-self:flex-end;width:36px;height:36px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;margin:0 0 12px;flex:none}
.xbtn:active{opacity:.6}
.xbtn svg{width:15px;height:15px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}
#asbody{overflow-y:auto;border-radius:13px;background:var(--cell);min-height:0}
.mrow{display:flex;align-items:center;gap:16px;width:100%;padding:0 16px;height:60px;font-size:17.5px;position:relative}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:16px;right:16px;height:.5px;background:#3a3a3c}
.mrow:active{background:var(--hl)}
.mrow .lic{width:30px;height:30px;color:var(--blue);display:grid;place-items:center;flex:none}
.mrow .lic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mrow span{flex:1}
.confirm{padding:22px 18px 16px;text-align:center}
.confirm .cic{width:54px;height:54px;border-radius:50%;background:#0d2238;display:grid;place-items:center;margin:0 auto 12px}
.confirm .cic svg{width:30px;height:30px;stroke:#9fd0ff;fill:none;stroke-width:1.8;stroke-linecap:round}
.confirm h3{margin:0 0 8px;font-size:20px;font-weight:700}
.confirm p{margin:0 0 18px;color:var(--t2);font-size:15px;line-height:1.4}

/* ---------- page sheet (modal) ---------- */
#modal{position:absolute;left:0;right:0;bottom:0;top:10px;z-index:30;background:var(--cell);border-radius:12px 12px 0 0;transform:translateY(102%);transition:transform .5s var(--ease);overflow:hidden;box-shadow:0 -4px 30px rgba(0,0,0,.5)}
#modal.on{transform:none}
#modal.drag{transition:none}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#48484a;z-index:2}
.mpage{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cell);transition:transform .42s var(--ease),filter .42s var(--ease)}
.mpage.right{transform:translateX(100%)}
.mpage.left{transform:translateX(-28%);filter:brightness(.6)}
.mnav{flex:none;height:56px;display:grid;grid-template-columns:90px 1fr 90px;align-items:end;padding-bottom:8px}
.mnav h2{margin:0;font-size:17px;font-weight:600;text-align:center}
.mnav button{color:var(--blue);font-size:17px;justify-self:start;padding:6px 16px}
.mnav button:active{opacity:.45}
.mbody{flex:1;overflow-y:auto;padding:0 16px 20px}
.mbody .group{background:var(--cell2)}
.mbody .cell+.cell::before{background:#48484a}
.mfoot{flex:none;padding:10px 16px 20px;background:linear-gradient(rgba(28,28,30,0),var(--cell) 30%)}
.okmark{width:92px;height:92px;margin:60px auto 18px}
.okmark circle{fill:none;stroke:var(--green);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .6s var(--ease) forwards}
.okmark path{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s .45s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* popover + toast */
#pop{position:absolute;z-index:40;max-width:250px;background:#3a3a3c;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;color:#f2f2f7;box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transform:scale(.9);transform-origin:var(--ox,20px) 0;transition:opacity .18s,transform .18s;pointer-events:none}
#pop.on{opacity:1;transform:none;pointer-events:auto}
#pop::before{content:"";position:absolute;top:-7px;left:var(--ax,20px);width:14px;height:14px;background:#3a3a3c;transform:rotate(45deg);border-radius:2px}
#toast{position:absolute;left:50%;bottom:74px;z-index:50;transform:translate(-50%,16px);background:rgba(58,58,60,.97);color:#fff;border-radius:14px;padding:12px 16px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:9px;opacity:0;transition:opacity .25s,transform .35s var(--ease);pointer-events:none;max-width:calc(100% - 40px);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:18px;height:18px;stroke:var(--green);stroke-width:2.6;fill:none;flex:none}

/* search */
.search{display:flex;align-items:center;gap:6px;height:37px;border-radius:10px;background:var(--seg);padding:0 9px;margin:10px 0 4px}
.search svg{width:17px;height:17px;stroke:#8e8e93;stroke-width:2;fill:none;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;height:100%}
.search input::placeholder{color:#8e8e93}
.mini{width:44px;height:28px;border-radius:4px;flex:none;background-size:100% 100%;box-shadow:0 0 0 .5px rgba(255,255,255,.25) inset}

/* offers */
.offer{display:flex;gap:13px;align-items:center;padding:13px 14px;background:var(--cell);border-radius:12px;width:100%;text-align:left}
.offer+.offer{margin-top:10px}
.offer:active{background:#242426}
.logo{width:50px;height:50px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;letter-spacing:.02em}
.offer .main{flex:1;min-width:0}
.offer .t{font-size:16px;font-weight:600}
.offer .s{font-size:13.5px;color:var(--t2);margin-top:2px}
.offer .s2{font-size:13px;color:var(--t2);margin-top:5px}
.addb{width:34px;height:34px;border-radius:50%;border:1.6px solid var(--blue);color:var(--blue);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.addb svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.addb.on{background:var(--green);border-color:var(--green);color:#000}

/* blocs */
.bloc{display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:14px;background:var(--cell);border-radius:12px}
.bloc+.bloc{margin-top:10px}
.bloc:active{background:#242426}
.bloc .main{flex:1;min-width:0}
.bloc .t{font-size:16px;font-weight:600;line-height:1.25}
.bloc .s{font-size:13.5px;color:var(--t2);margin-top:3px}
.hex{width:46px;height:50px;flex:none}

/* power */
.gauge{display:grid;justify-items:center;padding:18px 0 6px}
.gauge svg{width:190px;height:112px}
.gauge .gv{font-size:34px;font-weight:700;margin-top:-50px}
.gauge .gl{font-size:15px;margin-top:4px;font-weight:600}
.bars{display:grid;gap:13px;padding:14px 16px}
.bar{display:grid;grid-template-columns:1fr 40px;gap:10px;align-items:center;font-size:14px}
.bar .n{grid-column:1/-1;color:#e5e5ea}
.bar .tr{position:relative;height:6px;border-radius:3px;background:#3a3a3c}
.bar .tr::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:#636366}
.bar .f{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .val{text-align:right}

/* chat */
.chat{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;padding:9px 13px;border-radius:19px;font-size:16px;line-height:1.35;-webkit-user-select:text;user-select:text;animation:pop .25s var(--ease)}
.msg.me{align-self:flex-end;background:var(--fill);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#26262a;border-bottom-left-radius:6px}
.msg b{font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.qr{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none;flex:none}
.qr::-webkit-scrollbar{display:none}
.qr button{flex:none;border:1px solid #3a3a3c;border-radius:16px;padding:7px 12px;font-size:14px;color:var(--blue)}
.cbar{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px 10px;border-top:.5px solid #242426;background:#0e0e0f}
.cbar input{flex:1;min-width:0;height:36px;border-radius:18px;border:1px solid #3a3a3c;background:#000;padding:0 14px;font-size:16px;outline:0}
.cbar button{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.cbar button svg{width:16px;height:16px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01s!important;animation-duration:.01s!important}}

    let lat,lon;if(rho<1e-6){lat=lat0;lon=lon0}else{lat=Math.asin(Math.cos(cc)*sl0+ny*Math.sin(cc)*cl0/rho);lon=lon0+Math.atan2(nx*Math.sin(cc),rho*Math.cos(cc)*cl0-ny*Math.sin(cc)*sl0)}
    const lam=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]);let v=.18+.82*lam;const land=isLand(lat*180/Math.PI,((lon*180/Math.PI+540)%360)-180);v=land?v*.38:v*.9+.08;
    const th=(1-v)*2.9+.25;x.fillRect(gx+xx,gy+yy-th/2,1.5,th)}}
  x.globalAlpha=.4;x.lineWidth=.7;x.strokeStyle=p.ink;
  const proj=(la,lo)=>{const cl=Math.cos(la),dl=lo-lon0;const z=sl0*Math.sin(la)+cl0*cl*Math.cos(dl);return[gx+Rg*cl*Math.sin(dl),gy-Rg*(cl0*Math.sin(la)-sl0*cl*Math.cos(dl)),z]};
  const line=(f)=>{x.beginPath();let on=false;for(let s=0;s<=180;s++){const q=f(s);if(q[2]>0){on?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]);on=true}else on=false}x.stroke()};
  for(let m=-180;m<180;m+=30)line(s=>proj((s-90)*Math.PI/180,m*Math.PI/180));
  for(let pl=-60;pl<=60;pl+=30)line(s=>proj(pl*Math.PI/180,(s*2-180)*Math.PI/180));
  x.globalAlpha=1;x.lineWidth=1.8;x.beginPath();x.arc(gx,gy,Rg,0,7);x.stroke();
  const q=proj(c.ll[0]*Math.PI/180,c.ll[1]*Math.PI/180);
  if(q[2]>0){x.beginPath();x.arc(q[0],q[1],5.2,0,7);x.fillStyle=t==='graph'?'#fff':'#fff';x.fill();x.lineWidth=2;x.strokeStyle=p.ink;x.stroke();x.beginPath();x.arc(q[0],q[1],1.6,0,7);x.fillStyle=p.ink;x.fill()}
  x.restore();
  x.globalAlpha=.9;x.strokeStyle=p.ink;x.lineWidth=1.1;x.beginPath();x.ellipse(gx,gy+2,Rg+9,Rg*.26,-.32,Math.PI*.05,Math.PI*.95);x.stroke();x.globalAlpha=1;
}

const rail=$('#rail'),PITCH=226;let slots=[],curK=0,medQ=[];

    return `<div class="slot" data-k="${k}"><div class="card t-${t}${st.frozen[iso]?' frozen':''}" style="background-image:${tex(t)}" role="button" aria-label="${esc(c.n)} card"><canvas class="med" width="168" height="210"></canvas><span class="c-no num">${c.i}</span><span class="c-name${nm.length>24?' s2':nm.length>19?' s1':''}">${esc(nm)}</span><i class="c-gloss"></i><i class="c-frost">${IC.snow}</i><i class="c-dim"></i></div></div>`}).join('');
  slots=$$('.slot',rail);medQ=slots.map((s,k)=>k);
}
function drawNearMedals(){const order=medQ.slice().sort((a,b)=>Math.abs(a-curK)-Math.abs(b-curK));let n=0;
  for(const k of order){if(n>=3)break;const cv=$('canvas',slots[k]);if(cv&&!cv.dataset.done){const c=byIso[st.wallet[k]];drawMedal(cv,c,tier(c));cv.dataset.done=1;medQ.splice(medQ.indexOf(k),1);n++}}
  if(medQ.length)setTimeout(drawNearMedals,60)}
let raf=0;
function frame(){raf=0;const f=rail.scrollLeft/PITCH,k0=Math.round(f);
  for(let k=Math.max(0,k0-3);k<=Math.min(slots.length-1,k0+3);k++){const d=k-f,a=Math.min(1,Math.abs(d));slots[k].style.setProperty('--a',a.toFixed(3));slots[k].style.setProperty('--d',Math.max(-1.5,Math.min(1.5,d)).toFixed(3))}
  const k=Math.max(0,Math.min(slots.length-1,k0));if(k!==curK){curK=k;st.cur=st.wallet[k];save();renderHome(true);drawNearMedals()}}
rail.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(frame)},{passive:true});
function goto(k,smooth){k=Math.max(0,Math.min(slots.length-1,k));rail.scrollTo({left:k*PITCH,behavior:smooth?'smooth':'auto'});if(!smooth){curK=k;st.cur=st.wallet[k];frame();renderHome(false)}}

const stage=$('#stage'),rootL=$('#root');const stack=[];
function screen(title,body,opt={}){const el=document.createElement('section');el.className='scr';el.setAttribute('role','dialog');el.setAttribute('aria-label',title);

function push(el){const prev=stack.length?stack[stack.length-1]:rootL;stage.appendChild(el);el.getBoundingClientRect();el.classList.add('in');prev.classList.add('layer','under');stack.push(el);closePop();edgeSwipe(el);return el}
function pop(){const el=stack.pop();if(!el)return;const prev=stack.length?stack[stack.length-1]:rootL;el.classList.remove('in');prev.classList.remove('under');setTimeout(()=>el.remove(),460);closePop()}
function popAll(){while(stack.length){const el=stack.pop();el.remove()}rootL.classList.remove('under')}
function edgeSwipe(el){let sx=null,dx=0,t0=0;
  el.addEventListener('pointerdown',e=>{if(e.clientX-el.getBoundingClientRect().left<26){sx=e.clientX;dx=0;t0=performance.now();el.classList.add('drag');el.setPointerCapture(e.pointerId)}});
  el.addEventListener('pointermove',e=>{if(sx==null)return;dx=Math.max(0,e.clientX-sx);el.style.transform=`translateX(${dx}px)`});
  const end=()=>{if(sx==null)return;el.classList.remove('drag');el.style.transform='';const v=dx/(performance.now()-t0);if(dx>el.clientWidth*.33||v>.6)pop();sx=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}

function bars(c){return `<div class="group bars">${S.map((s,k)=>{const v=c.m[k];return `<div class="bar"><div class="n">${esc(s.short)}</div><div class="tr"><div class="f" style="${v>=0?'left:50%':'right:50%'};width:${Math.abs(v)/3*50}%;background:${v>=0?'var(--green)':'var(--red)'}"></div></div><div class="val num ${cls(v)}">${sgn(v,0)}</div></div>`}).join('')}</div>`}

/* chat: answers composed from the model data */
const ALIAS={'us':'USA','u.s.':'USA','usa':'USA','america':'USA','united states':'USA','uk':'GBR','britain':'GBR','korea':'KOR','uae':'ARE','emirates':'ARE','drc':'COD','congo':'COD','turkiye':'TUR','t\u00fcrkiye':'TUR','saudi':'SAU'};
const SKEY=[['multipolar_technology_blocs',/multipolar|blocs? scenario/],['us_led_ai_capital',/us[- ]led|u\.s\.[- ]led|american dominance|us dominance/],['broad_ai_abundance',/abundance|leapfrog/],['china_industrial_open_models',/china[- ]cent|chinese|open[- ]model/],['fragmentation_shocks',/fragment|conflict|war|shock/]];
function findCountries(q){const out=[],l=' '+q.toLowerCase()+' ';for(const c of C){const n=c.n.toLowerCase();if(l.includes(' '+n+' ')||l.includes(' '+n+'?')||l.includes(' '+n+',')||l.includes(' '+n+"'")||new RegExp('\\b'+c.i.toLowerCase()+'\\b').test(l)&&c.i.length===3&&/[A-Z]{3}/.test(q))out.push(c)}
  for(const[a,i]of Object.entries(ALIAS))if(new RegExp('(^|[^a-z])'+a.replace('.','\\.')+'($|[^a-z])').test(l)&&!out.includes(byIso[i]))out.push(byIso[i]);return out}
function answer(q){const l=q.toLowerCase(),cs=findCountries(q),sc=SKEY.find(s=>s[1].test(l));const sk=sc?scenIdx(sc[0]):-1;const scored=C.filter(c=>c.m);
  if(cs.length>=2&&cs[0].m&&cs[1].m){const[a,b]=cs;return `<b>${esc(a.n)}</b> ${sgn(weighted(a))} vs <b>${esc(b.n)}</b> ${sgn(weighted(b))} on the weighted outlook. `+S.map((s,k)=>`${s.short}: ${sgn(a.m[k],0)} / ${sgn(b.m[k],0)}`).join('; ')+'.'}
  if(cs.length){const c=cs[0];if(!c.m)return `<b>${esc(c.n)}</b> is a seed row in ${esc(c.r)}. It has no scenario scores yet.`;
    const hi=Math.max(...c.m),lo=Math.min(...c.m);
    if(sk>=0)return `In <b>${esc(S[sk].name)}</b>, ${esc(c.n)} scores ${sgn(c.m[sk],0)} (${VERD[c.m[sk]].toLowerCase()}).`;
    if(/best|strongest|win/.test(l))return `${esc(c.n)} does best in <b>${S.filter((s,k)=>c.m[k]===hi).map(s=>esc(s.short)).join(', ')}</b> (${sgn(hi,0)}).`;
    if(/worst|weak|risk|lose/.test(l))return `${esc(c.n)} is most exposed in <b>${S.filter((s,k)=>c.m[k]===lo).map(s=>esc(s.short)).join(', ')}</b> (${sgn(lo,0)}).`;
    return `<b>${esc(c.n)}</b>: weighted outlook ${sgn(weighted(c))}, range ${sgn(lo,0)} to ${sgn(hi,0)}. ${esc(c.t||'')}`}
  if(sk>=0){const s=S[sk],top=scored.slice().sort((a,b)=>b.m[sk]-a.m[sk]||base(b)-base(a)),bot=top.slice().reverse();
    return `<b>${esc(s.name)}</b> (prior ${s.prior}%). ${esc(s.desc)} Strongest: ${top.slice(0,4).map(c=>esc(c.n)).join(', ')}. Weakest: ${bot.slice(0,3).map(c=>esc(c.n)+' '+sgn(c.m[sk],0)).join(', ')}.`}
  if(/top|rank|best|leader/.test(l)){const t=scored.slice().sort((a,b)=>weighted(b)-weighted(a)).slice(0,5);return 'Top weighted outlooks: '+t.map((c,i)=>`${i+1}. ${esc(c.n)} ${sgn(weighted(c))}`).join(', ')+'.'}
  if(/bottom|lowest|worst/.test(l)){const t=scored.slice().sort((a,b)=>weighted(a)-weighted(b)).slice(0,5);return 'Lowest weighted outlooks: '+t.map(c=>`${esc(c.n)} ${sgn(weighted(c))}`).join(', ')+'.'}
  if(/scenario|future/.test(l))return 'The model has five futures: '+S.map(s=>`${esc(s.short)} (${s.prior}%)`).join(', ')+'. Ask about any of them.';
  return 'I can answer from the model data. Try a country (\u201cMexico\u201d), a comparison (\u201cIndia vs China\u201d), a future (\u201cwho wins in fragmentation?\u201d) or \u201ctop countries\u201d.'}
function chatScreen(){const c=cur();
  const el=screen('Chat',`<div class="chat" id="chat"><div class="msg bot">Hi. I answer from the World Model data. Ask about any country, a comparison, or one of the five futures.</div></div>
  <div class="qr">${[c.n,`Best future for ${c.n}`,'Top countries','Who wins in fragmentation?','India vs China'].map(t=>`<button data-a="quick" data-x="${esc(t)}">${esc(t)}</button>`).join('')}</div>
  <form class="cbar" id="cf"><input id="cin" placeholder="Message" autocomplete="off" aria-label="Message" enterkeyhint="send"><button type="submit" aria-label="Send">${IC.send}</button></form>`,{raw:1,navTitle:'Model Chat'});
  push(el);$('#cf',el).addEventListener('submit',e=>{e.preventDefault();const v=$('#cin',el).value.trim();if(v){$('#cin',el).value='';ask(el,v)}})}
function ask(el,q){const ch=$('#chat',el);ch.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(q)}</div><div class="msg bot typing" id="typ"><i></i><i></i><i></i></div>`);ch.scrollTop=ch.scrollHeight;
  setTimeout(()=>{const t=$('#typ',ch);if(t)t.outerHTML=`<div class="msg bot">${answer(q)}</div>`;ch.scrollTop=ch.scrollHeight},650+Math.random()*350)}

  mback:()=>mpop(),
  cancel:()=>closeModal(),
  submit:(el)=>{el.disabled=true;el.innerHTML='<span class="spin"></span>';setTimeout(()=>{st.scen=pick;st.runs.unshift({s:pick,t:Date.now()});st.runs=st.runs.slice(0,8);save();renderHome(false);mpush(runDone())},1100)},
  done:()=>{closeModal();toast('Showing '+scenShort(st.scen))},
  switcher:()=>switcherScreen(),
  gocountry:(el)=>goCountry(el.dataset.x),
  addCountry:(el)=>{const iso=el.dataset.x;goCountry(iso);toast(byIso[iso].n+' added to wallet')},
  removeCountry:()=>{const c=cur(),k=st.wallet.indexOf(c.i);st.wallet.splice(k,1);delete st.frozen[c.i];st.cur=st.wallet[Math.max(0,k-1)];save();popAll();buildRail();drawNearMedals();requestAnimationFrame(()=>goto(st.wallet.indexOf(st.cur),false));toast(c.n+' removed')},
  chat:()=>chatScreen(),
  quick:(el)=>ask(el.closest('.scr'),el.dataset.x),
  bloc:(el)=>blocScreen(el.dataset.x),
  oppSeg:(el)=>{oppSeg=el.dataset.x;renderOpps()},
  track:(el,e)=>{e.stopPropagation();const k=el.dataset.x;if(st.tracked[k])delete st.tracked[k];else st.tracked[k]=1;save();const on=!!st.tracked[k];
    if(el.closest('#tab-opps')&&oppSeg==='all'){el.classList.toggle('on',on);el.innerHTML=on?IC.check:IC.plus;const n=Object.keys(st.tracked).length,b=$('#obadge');b.hidden=!n;b.textContent=n;$('#tab-opps [data-x=tracked]').textContent='Tracked'+(n?' ('+n+')':'')}else if(el.closest('#tab-opps'))renderOpps();else{el.classList.toggle('on',on);el.innerHTML=on?IC.check:IC.plus;renderOpps()}
    toast(on?'Tracking '+P[k].name:'Stopped tracking')},
  opp:(el)=>projectScreen(+el.dataset.x),
  overlays:()=>listScreen('Scenario Overlays',`<div class="gf" style="padding:0 4px 10px">Shocks that can sit on top of any future, with subjective probabilities.</div><div class="group">${D.overlays.slice().sort((a,b)=>b.p-a.p).map(o=>cellRow(esc(cap(o.id.replace(/_/g,' '))),o.p+'%',{s:esc(o.d),swrap:1,wrap:1,dim:1})).join('')}</div>`),
  groups:()=>listScreen('Beneficiary Groups',`<div class="group">${D.groups.map(g=>cellRow(esc(g.n),null,{s:esc(g.d),swrap:1})).join('')}</div>`),
  sources:()=>listScreen('Data Sources',`<div class="gf" style="padding:0 4px 10px">${D.sources.total} sources in the ledger. Most cited domains:</div><div class="group">${D.sources.domains.map(d=>cellRow(esc(d[0]),d[1],{dim:1})).join('')}</div>`),
  method:()=>listScreen('Methodology',`<div class="para">The model tracks four futures at once: national power, productive capacity, median-citizen life and who owns the gains.<br><br>Each priority country gets a score from \u22123 (severe loser) to +3 (strong beneficiary) in five scenarios. The weighted outlook blends those scores using the scenario priors, which you can change under Scenario Weights.<br><br>Card finishes follow the outlook at package priors: Platinum +1.75 and up, Gold +1.00, Blue +0.40, Graphite below that. Seed countries have no research yet.<br><br>Scores are analyst models, not facts. Check sources, confidence and missing data before relying on any number.</div>`),
  resetAsk:()=>openSheet(`<div class="confirm"><h3>Reset wallet?</h3><p>This restores the 40 priority countries, package weights, and clears frozen countries, tracked items and scenario runs.</p><button class="primary" style="background:var(--red)" data-a="resetWallet">Reset</button><button class="plain" data-a="closeSheet">Cancel</button></div>`),
  resetWallet:()=>{st={wallet:DEFAULT_WALLET.slice(),cur:DEFAULT_WALLET[0],scen:'weighted',w:PRI.slice(),frozen:{},tracked:{},auto:{sweep:true,alerts:true,twosrc:false},runs:[]};save();closeSheet();buildRail();drawNearMedals();renderAcct();renderOpps();setTab('acct');requestAnimationFrame(()=>goto(0,false));toast('Wallet reset')}
};
const mrow=(a,ic,t)=>`<button class="mrow" data-a="${a}"><span class="lic">${ic}</span><span>${t}</span>${IC.chev}</button>`;
$('#app').addEventListener('click',e=>{if(suppress)return;const el=e.target.closest('[data-a]');if(!el){closePop();return}if(el.dataset.a!=='info')closePop();const f=A[el.dataset.a];if(f){f(el,e)}});
$('#app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.offer')){A.opp(e.target)}if(e.key==='Escape'){if(pop$.classList.contains('on'))closePop();else if(ash.classList.contains('on'))closeSheet();else if(modal.classList.contains('on'))closeModal();else if(stack.length)pop()}});
document.addEventListener('touchstart',()=>{},{passive:true});
$('#app').addEventListener('scroll',e=>{e.currentTarget.scrollTop=0;e.currentTarget.scrollLeft=0});

/* ---------------- boot ---------------- */
buildRail();
requestAnimationFrame(()=>{goto(Math.max(0,st.wallet.indexOf(st.cur)),false);drawNearMedals()});
})();
</script>

</body>
</html>
